name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      -name: Checkout
      uses:action/checkout@v4

      -name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          arch: 'win64_msvc2022_64'
          cache: true

      -name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      -name: Configure
      run: cmake --preset ci-windows

      -name: Build
        run: cmake --build out/build/ci-windows
